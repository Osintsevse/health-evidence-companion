<style>
:root{font-family:Inter,Segoe UI,system-ui,sans-serif;color:#172638;background:#f3f6fa;--accent:#125f6a;--line:#dbe3ec;--muted:#56687b}*{box-sizing:border-box}body{margin:0}header{background:white;border-bottom:1px solid var(--line);padding:24px 32px;display:flex;justify-content:space-between;gap:20px;align-items:center}h1{font-size:26px;letter-spacing:-.6px;margin:0 0 5px}h2{font-size:22px;margin:0 0 14px}h3{font-size:16px;margin:0 0 10px}p{line-height:1.55;margin:8px 0}.muted,.meta{color:var(--muted);font-size:13px}a{color:var(--accent)}.layout{display:grid;grid-template-columns:220px minmax(0,1fr);min-height:calc(100vh - 100px)}nav{padding:24px 16px;background:#fafbfd;border-right:1px solid var(--line)}nav button{display:block;width:100%;padding:12px 14px;margin:4px 0;border:0;border-radius:8px;background:transparent;text-align:left;font:inherit;color:var(--muted);cursor:pointer}nav button.active{background:#dceff0;color:#064b55;font-weight:650}main{padding:28px 32px;max-width:1600px;width:100%}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px;margin-bottom:24px}.card,article,.panel{background:white;border:1px solid var(--line);border-radius:12px;padding:20px;margin-bottom:16px}.card strong{display:block;font-size:27px;margin:8px 0}.toolbar{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin:12px 0 18px}input,select,button.control{font:inherit;font-size:14px;padding:10px 12px;border:1px solid #c8d4df;border-radius:7px;background:white}input{min-width:220px;flex:1}.scroll{overflow:auto;max-height:70vh;border:1px solid var(--line);border-radius:8px;background:white}table{border-collapse:separate;border-spacing:0;width:100%;font-size:13px}th,td{padding:12px 14px;text-align:left;vertical-align:top;border-bottom:1px solid #e5ebf1;border-right:1px solid #eef2f6;line-height:1.45}th{background:#edf2f6;font-weight:650;position:sticky;top:0;z-index:2;white-space:normal;min-width:140px}th:first-child,td:first-child{position:sticky;left:0;z-index:1;min-width:125px;background:#fafbfd}th:first-child{z-index:3;background:#edf2f6}tr:last-child td{border-bottom:0}.matrix th{min-width:150px}.matrix td{min-width:130px}.matrix td.event{min-width:220px}.pill{display:inline-block;font-size:11px;line-height:1.5;padding:3px 8px;border-radius:20px;background:#eef2f6;color:#536174;margin:4px 4px 0 0}.warn{background:#fff2d4;color:#7a570c}.reported{background:#e4edf9;color:#33567d}.value{font-weight:650;font-size:14px}.flag{color:#7a570c;font-size:12px}.empty{padding:30px;color:var(--muted);background:#fff;border:1px dashed #c5d1dc;border-radius:10px}.source{font-size:12px;margin-top:9px}.timeline article{border-left:4px solid #b7d2d6}.summary-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(330px,1fr));gap:16px}details{margin-top:12px}summary{cursor:pointer;color:var(--accent)}pre{white-space:pre-wrap;overflow-wrap:anywhere;font:12px/1.5 ui-monospace,monospace;background:#f5f7fa;padding:14px;border-radius:8px}svg{max-width:100%;height:auto}.feedback-warning{color:#b42318;background:#fff0ee;border:2px solid #b42318;padding:18px;font-size:20px;font-weight:750;line-height:1.5}textarea{display:block;width:100%;margin-top:14px;font:inherit;padding:12px;border:1px solid #c8d4df;border-radius:7px}details[data-answered-questions]>summary{padding:16px;background:#e7eff3;border-radius:8px;font-size:17px;font-weight:650}.original-preview{margin:12px 0;padding:8px;border:1px solid var(--line)}.original-preview img{display:block;width:100%;height:auto;max-height:760px;object-fit:contain}.original-preview figcaption{margin-top:8px}.notice{border-left:3px solid #cfad57;padding:10px 16px;background:#fff9e9;font-size:13px;border-radius:6px;margin:16px 0}footer{color:var(--muted);font-size:12px;margin-top:24px}body.print nav,body.print .toolbar{display:none}@media(max-width:850px){header{padding:18px;display:block}.layout{display:block}nav{display:flex;overflow:auto;padding:10px;position:sticky;top:0;z-inde </style></head><body><header><div><h1 id="title"></h1><div class="muted" id="subtitle"></div></div><div id="external"></div></header><div class="layout"><nav id="nav"></nav><main id="main"></main></div>
<script>
const DATA=__PRIVATE_MODEL__;
const EN={title:'Health archive',subtitle:'Sources, history and read-only views',overview:'Overview',vaccines:'Vaccinations',labs:'Laboratory history',vitals:'Measurements',history:'Clinical timeline',reports:'Reports and visits',conditions:'Conditions and allergies',medications:'Medicines',documents:'Documents',review:'Needs clarification',search:'Search',all:'All',blood:'Blood',urine:'Urine',stool:'Stool',date:'Date',source:'Source',unknown:'Unknown',uncertain:'Needs clarification',verified:'Transcription verified',reported:'Owner report',historical:'Historical record; current status not reassessed',empty:'No records are available for this view.',records:'Records',asof:'As of',snapshot:'Read-only view from the accepted database. Updates require a new verified generation.',disclaimer:'Informational archive; not a diagnosis, prescription or clinical decision system.',vaccineSheet:'Open vaccination Sheet',labSheet:'Open laboratory Sheet',original:'Original',details:'Details',infection:'Infection',product:'Vaccine',kind:'Type',rawDate:'Date as entered',dose:'Dose',result:'Result',comment:'Comment',batch:'Batch',manufacturer:'Manufacturer',labNote:'Rows are investigation events; columns are recorded analytes. Different units/specimens are separated. A displayed comparison does not establish assay comparability. Blank means no result, not zero. Click a value for its reference interval and source.',vaxNote:'The original history layout is retained. Tuberculin tests and reported diseases are not counted as vaccinations. Conflicting and placeholder dates remain visible with clarification labels.',rxNote:'Prescriptions and actual use are separate. A prescription, receipt or planned end date does not establish taking a medicine.',order:'Prescription',use:'Reported or documented use',legacy:'Previous archive context',sourceNote:'Source and uncertainty',noDate:'Date unknown',lab:'Laboratory',specimen:'Specimen',reference:'Reference',unit:'Unit',note:'Note',metricsNote:'Measurements are historical. No clinical interpretation or treatment threshold is added.',printedFlag:'Printed source flag',reviewNote:'These rows remain unresolved. Their raw tokens are preserved; ambiguous numeric values are not chart points.',accepted:'Committed records',sources:'Sources',measurements:'Results and measurements',unresolved:'Unresolved rows',legacyNote:'Preserved from the earlier summary with its original provenance. These entries have not been re-established as current clinical facts.',dataStatus:'Data status',openSheet:'Open Google Sheet',sourceText:'Source text',bp:'Ambulatory blood pressure',bpNote:'Raw recorded measurements from one report; missing pages and conclusions remain listed separately.',systolic:'SBP',diastolic:'DBP',pulse:'Pulse',map:'MAP',event:'Event',knownDate:'Event date',noCurrent:'Current use or clinical status is not established by this archive entry.',print:'Print this view',vaxRecord:'Vaccine record',mantoux:'Tuberculin test',diseaseHistory:'Reported disease history'};
const L={...EN,conditions:'Conditions',allergies:'Allergies and reactions',timeline:'Medication timeline',...DATA.labels};const $=id=>document.getElementById(id);const status=v=>(DATA.status_labels||{})[v]||v||'';
function el(tag,text,cls){const x=document.createElement(tag);if(text!==undefined)x.textContent=text;if(cls)x.className=cls;return x}
function link(label,url){const a=el('a',label);if(url&&(/^(https:\/\/|\.\.\/|details\/)/.test(url)))a.href=url;return a}
function originalURL(d){return d?.original_url||(d?.original_path?'../'+d.original_path.split('/').map(encodeURIComponent).join('/'):null)}
function source(r,preview=false){const div=el('div',undefined,'source'),d=DATA.documents.find(d=>d.entry_id===r.source_document_id);div.append(link('Parsed source '+(r.source_document_id||L.source),d?'details/'+d.entry_id+'.md':null),el('span',' · '+(r.source_locator||'')));const url=originalURL(d);if(url){const a=link('Original '+(d.original_filename||d.entry_id),url);a.target='_blank';a.rel='noopener';div.append(el('span',' · '),a)}else div.append(el('span',' · Original unavailable','meta'));if(preview&&d){const p=d.original_preview;if(p?.kind==='image'&&/^data:image\/(jpeg|png|webp);base64,/.test(p.data_url)){const figure=el('figure',undefined,'original-preview'),a=link('',url),image=el('img');image.src=p.data_url;image.alt='Preview of '+(d.original_filename||d.entry_id);image.loading='lazy';image.width=p.width;image.height=p.height;a.target='_blank';a.rel='noopener';a.append(image);figure.append(a,el('figcaption',p.note,'meta'));div.append(figure)}else if(p?.kind==='text'){const details=el('details');details.append(el('summary','View original text'),el('pre',p.text),el('p',p.note,'meta'));div.append(details)}else if(d.preview_note)div.append(el('p',d.preview_note,'meta'))}return div}
function badge(r){return el('span',r.review_status==='needs_review'||r.review_status==='unreadable'?L.uncertain:r.source_kind==='owner_report'?L.reported:L.verified,'pill '+(r.review_status==='needs_review'||r.review_status==='unreadable'?'warn':r.source_kind==='owner_report'?'reported':''))}
function rawDetails(r){const d=el('details');d.append(el('summary',L.details));const p=el('div');p.append(el('p',(r.source_text||r.statement_raw||'')));for(const [k,label]of [['unit_raw',L.unit],['reference_range_raw',L.reference],['laboratory_raw',L.lab],['specimen_raw',L.specimen],['flag_raw',L.printedFlag],['uncertainties',L.note]])if(r[k])p.append(el('p',label+': '+r[k],'meta'));p.append(source(r),badge(r));d.append(p);return d}
function table(headers,rows,cls){const wrap=el('div',undefined,'scroll'),t=el('table',undefined,cls);const th=el('thead'),tr=el('tr');headers.forEach(h=>{const th=el('th');if(h instanceof Node)th.append(h);else th.textContent=h;tr.append(th)});th.append(tr);t.append(th);const b=el('tbody');for(const row of rows){const r=el('tr');for(const cell of row){const td=el('td');if(cell instanceof Node)td.append(cell);else td.textContent=cell??'—';r.append(td)}b.append(r)}t.append(b);wrap.append(t);return wrap}
function empty(parent){parent.append(el('div',L.empty,'empty'))}
function section(key){const m=$('main');m.replaceChildren(el('h2',L[key]));m.append(el('p',L.asof+': '+(DATA.as_of||DATA.generated_at.slice(0,10)),'meta'));return m}
function toolbar(parent,choices,onChange){const div=el('div',undefined,'toolbar'),q=el('input');q.placeholder=L.search;q.setAttribute('aria-label',L.search);const select=el('select');for(const [v,t]of choices){const opt=el('option',t);opt.value=v;select.append(opt)}div.append(q);if(choices.length)div.append(select);parent.append(div);q.addEventListener('input',()=>onChange(q.value.toLocaleLowerCase(),select.value));select.addEventListener('change',()=>onChange(q.value.toLocaleLowerCase(),select.value));return{q,select}}
function episodeContent(v){const p=el('div');if(v.reported_at)p.append(el('p',(L.reportedDate||'Reported')+': '+v.reported_at,'meta'));if(v.temperature_c!==undefined&&v.temperature_c!==null)p.append(el('p',(L.temperature||'Temperature')+': '+v.temperature_c+' °C','value'));p.append(el('p',L.noCurrent,'meta'));if(v.temperature_measurements?.length)p.append(table([L.date,L.temperature||'Temperature',L.source],v.temperature_measurements.map(r=>[r.measured_at||r.reported_date||L.noDate,r.value_c+' °C',r.source||L.unknown])));return p}function spirometryContent(v){const p=el('div');p.append(el('p',v.date||L.noDate,'meta'),table([L.sourceText,L.result,L.unit],[['FVC',v.fvc_l,'L'],['FEV1',v.fev1_l,'L'],['FEV1/FVC',v.fev1_fvc_pct,'%']]));if(v.physician_interpretation)p.append(el('p',(L.physicianConclusion||'Physician conclusion')+': '+v.physician_interpretation));if(v.quality_limitation)p.append(el('p',v.quality_limitation,'notice'));p.append(el('p',L.source+': '+(v.source||L.unknown),'meta'));return p}function undatedLabs(body,q,category){const rs=(DATA.undated_laboratory||[]).filter(r=>r.display_category===category&&JSON.stringify(r).toLocaleLowerCase().includes(q));if(!rs.length)return;body.append(el('h3',L.noDate));for(const r of rs){const a=el('article');a.append(el('p',r.analyte_name_raw+': '+r.raw_value+' '+(r.unit_raw||'')),badge(r),rawDetails(r));body.append(a)}}
function renderOverview(){const m=section('overview'),cards=el('div',undefined,'cards');const uncertain=Object.values(DATA.tables).flat().filter(r=>['needs_review','unreadable'].includes(r.review_status));for(const [label,value]of [[L.sources,DATA.documents.length],[L.measurements,DATA.tables.observations.length],[L.records,DATA.tables.clinical_entries.length],[L.unresolved,uncertain.length]]){const c=el('div',undefined,'card');c.append(el('div',label,'meta'),el('strong',String(value)));cards.append(c)}m.append(cards);const ctx=DATA.context.summary||{},grid=el('div',undefined,'summary-grid');for(const [label,value]of [[L.conditions,ctx.documented_conditions],[L.medications,ctx.medications],[L.legacy,ctx.active_episode]]){if(!value)continue;const p=el('div',undefined,'panel');p.append(el('h3',label));if(Array.isArray(value))for(const r of (label===L.medications?value.filter(r=>r.status?.startsWith('reported')):value)){p.append(el('p',r.label||r.product||r.code||''));p.append(el('p',[r.date||r.reported_at,status(r.status||r.current_status),r.reported_dose,r.source].filter(Boolean).join(' · '),'meta'))}else{p.append(episodeContent(value))}p.append(el('p',L.legacyNote,'meta'));grid.append(p)}m.append(grid);const latest=DATA.tables.clinical_entries.filter(r=>!r.entry_kind.includes('vaccin')&&!r.entry_kind.includes('tuberculin')&&!r.entry_kind.includes('disease_history')).slice().sort((a,b)=>(b.event_date||'').localeCompare(a.event_date||'')).slice(0,4);for(const r of latest)m.append(clinicalCard(r));m.append(el('div',L.snapshot,'notice'))}
function clinicalCard(r){const a=el('article');a.append(el('div',(r.event_date||L.noDate)+' · '+r.entry_kind,'meta'),el('p',r.statement_raw),badge(r),source(r));if(r.clinician_raw||r.organization_raw)a.append(el('p',[r.clinician_raw,r.organization_raw].filter(Boolean).join(' · '),'meta'));if(r.followup_raw)a.append(el('p',r.followup_raw));if(r.completion_status_raw)a.append(el('p',r.completion_status_raw,'meta'));if(r.uncertainties)a.append(el('p',r.uncertainties,'meta'));return a}
function renderVaccines(){const m=section('vaccines');m.append(el('p',L.vaxNote,'notice'));if(DATA.links.vaccinations)m.append(link(L.vaccineSheet,DATA.links.vaccinations));const body=el('div');toolbar(m,[['',L.all],['vaccination_record',L.vaxRecord],['tuberculin_test_record',L.mantoux],['reported_disease_history',L.diseaseHistory]],draw);m.append(body);function draw(q='',kind=''){body.replaceChildren();const records=DATA.vaccines.filter(r=>(!kind||r.entry_kind===kind)&&JSON.stringify(r).toLocaleLowerCase().includes(q));if(!records.length)return empty(body);const rows=records.map(r=>{const c=r.cells.slice();while(c.length<9)c.push(null);const date=el('div',c[3]||'—');date.append(el('div',L.knownDate+': '+(r.event_date||L.unknown),'meta'),badge(r));c[3]=date;const note=el('div',c[6]||'');if(r.uncertainties)note.append(el('p',r.uncertainties,'meta'));note.append(source(r));c[6]=note;return c});body.append(table([L.infection,L.product,L.kind,L.rawDate,L.dose,L.result,L.comment,L.batch,L.manufacturer],rows))}draw()}

function renderClinical(key){const m=section(key),body=el('div',undefined,'timeline');toolbar(m,[],draw);m.append(body);function draw(q=''){body.replaceChildren();const rs=DATA.tables.clinical_entries.filter(r=>!['vaccination_record','tuberculin_test_record','reported_disease_history'].includes(r.entry_kind)&&JSON.stringify(r).toLocaleLowerCase().includes(q)&&(key!=='reports'||['imaging_report','imaging_findings','imaging_summary_translation','encounter','procedure','investigation_order'].includes(r.entry_kind)));rs.sort((a,b)=>(b.event_date||'').localeCompare(a.event_date||''));if(!rs.length)return empty(body);rs.forEach(r=>body.append(clinicalCard(r)))}draw()}

function renderMeds(){const m=section('medications');m.append(link('Open medication timeline','index.html#timeline'));m.append(el('p',L.rxNote,'notice'));const legacy=(DATA.context.summary||{}).medications||[];if(legacy.length){const p=el('div',undefined,'panel');p.append(el('h3',L.legacy),table([L.product,L.use,L.date,L.sourceNote],legacy.map(r=>[r.product,[status(r.status),r.reported_dose,r.prescribed_dose].filter(Boolean).join(' · '),r.reported_at||L.unknown,[r.source,r.notes].filter(Boolean).join(' · ')])));m.append(p)}for(const r of DATA.tables.medication_orders){const a=el('article');a.append(el('h3',L.order+' · '+(r.event_date||L.noDate)),el('p',r.source_text),el('p',L.noCurrent,'meta'),badge(r),source(r));if(r.uncertainties)a.append(el('p',r.uncertainties,'meta'));m.append(a)}for(const r of DATA.tables.medication_use_events){const a=el('article');a.append(el('h3',L.use+' · '+(r.event_date||L.noDate)),el('p',r.source_text),badge(r),source(r));if(r.uncertainties)a.append(el('p',r.uncertainties,'meta'));if(r.benefit_reported_raw)a.append(el('p',r.benefit_reported_raw));if(r.adverse_effect_reported_raw)a.append(el('p',r.adverse_effect_reported_raw));m.append(a)}}
function renderDocs(){const m=section('documents'),body=el('div');toolbar(m,[],draw);m.append(body);function draw(q=''){body.replaceChildren();const docs=DATA.documents.filter(d=>JSON.stringify(d).toLocaleLowerCase().includes(q));for(const d of docs){const a=el('article');a.append(el('h3',d.title),el('p',(d.document_date||L.noDate)+' · '+d.document_kind,'meta'),link(L.original,d.original_url||(d.original_path?'../'+d.original_path:null)),el('span',' · '),link(L.details,'details/'+d.entry_id+'.md'));if(d.missing_pages)a.append(el('p',d.missing_pages,'notice'));body.append(a)}if(!docs.length)empty(body)}draw()}

function renderVitals(){const m=section('vitals');m.append(el('p',L.metricsNote,'notice'));const rs=DATA.tables.observations.filter(r=>(r.method_raw||'').includes('ABPM')||['mmHg','bpm'].includes(r.unit_raw));if(rs.length){const grouped={};for(const r of rs){const time=(r.source_locator.match(/\([12]\)(\d\d:\d\d)/)||[])[1]||'';const key=[r.source_document_id,r.event_date||'',time].join('|');const g=grouped[key]||(grouped[key]={date:r.event_date,time,doc:r.source_document_id,values:{},uncertain:false});(g.values[r.analyte_name_raw]||(g.values[r.analyte_name_raw]=[])).push(r);if(['needs_review','unreadable'].includes(r.review_status))g.uncertain=true}const rows=Object.values(grouped).sort((a,b)=>[a.date||'9999',a.time].join().localeCompare([b.date||'9999',b.time].join()));m.append(el('h3',L.bp),el('p',L.bpNote,'meta'),table([L.date,L.systolic,L.diastolic,L.map,L.pulse,L.source],rows.map(g=>{function cell(names){const x=el('div');const records=names.flatMap(n=>g.values[n]||[]);if(!records.length)return null;for(const r of records){x.append(el('div',r.raw_value,'value'),badge(r),rawDetails(r))}return x}return[(g.date||L.noDate)+' '+g.time,cell(['SBP','SYS']),cell(['DBP','DIA']),cell(['MAP']),cell(['Pulse','PR']),link(g.doc,'details/'+g.doc+'.md')]})))}else empty(m);const ctx=DATA.context.summary||{};if(ctx.active_episode){const p=el('div',undefined,'panel');p.append(el('h3',L.legacy),episodeContent(ctx.active_episode),el('p',L.legacyNote,'meta'));m.append(p)}if(ctx.spirometry){const p=el('div',undefined,'panel');p.append(el('h3',L.spirometry||'Spirometry'),spirometryContent(ctx.spirometry),el('p',L.legacyNote,'meta'));m.append(p)}}
function renderReview(){const m=section('review'),warning=()=>el('p','ANSWERS ARE NOT SENT OR ACCEPTED AUTOMATICALLY. These fields save a draft in this browser. Download the answers and provide the file for review, or use the private feedback Sheet.','feedback-warning');m.append(warning());if(DATA.links.feedback)m.append(link('Open the private answer Sheet',DATA.links.feedback));const download=()=>{const answers=[...m.querySelectorAll('textarea[data-question]')].filter(x=>x.value.trim()).map(x=>({question_id:x.dataset.question,answer:x.value.trim()}));const url=URL.createObjectURL(new Blob([JSON.stringify({format:'medical-archive-feedback/1',exported_at:new Date().toISOString(),answers},null,2)],{type:'application/json'})),a=document.createElement('a');a.href=url;a.download='medical-archive-answers.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)},button=()=>{const b=el('button','Download completed answers','control');b.onclick=download;return b};m.append(button());const closed=new Set(['accepted','accepted_with_uncertainty','accepted_unknown','excluded_by_owner','resolved_from_sources']),questions=DATA.review_questions||[],active=el('div'),answered=el('details');active.dataset.openQuestions='true';answered.dataset.answeredQuestions='true';const count=questions.filter(q=>closed.has(q.status)).length;answered.append(el('summary','Answered questions ('+count+')'));m.append(el('h3','Open questions ('+(questions.length-count)+')'),active);if(count)m.append(answered);for(const q of questions){const card=el('article');card.id=q.question_id;card.append(el('h3',q.title),el('p',q.question),el('p',q.question_id+' · '+q.status,'meta'));if(q.resolution_text)card.append(el('p',q.resolution_text,'notice'));for(const did of q.document_ids||[])card.append(source({source_document_id:did},true));const input=el('textarea');input.dataset.question=q.question_id;input.rows=3;input.setAttribute('aria-label','Answer: '+q.title);const key='medical-feedback:'+DATA.feedback_storage_key+':'+q.question_id;try{input.value=localStorage.getItem(key)??q.last_answer??''}catch{input.value=q.last_answer??''}input.oninput=()=>{try{localStorage.setItem(key,input.value)}catch{}};card.append(input);(closed.has(q.status)?answered:active).append(card)}if(questions.length===count)active.append(el('p','No open questions. Answers and sources remain in the answered section.','meta'));m.append(warning(),button())}
function renderMedicationTimeline(){const m=section('timeline');m.append(el('p','Dated reports of use, effects and non-initiation are separate from prescriptions. Gaps do not imply continuous exposure. Unknown start and stop dates remain unknown.','notice'));const groups=[...new Set((DATA.medication_timeline||[]).map(r=>r.group))].sort(),filter=el('select'),mode=el('select');filter.setAttribute('aria-label','Medicine');for(const g of ['',...groups]){const o=el('option',g||'All medicines');o.value=g;filter.append(o)}for(const [v,t]of [['use','Use and reported effects'],['all','Use and prescriptions'],['order','Prescriptions']]){const o=el('option',t);o.value=v;mode.append(o)}mode.setAttribute('aria-label','Record type');const tools=el('div',undefined,'toolbar'),body=el('div',undefined,'timeline');tools.append(filter,mode);m.append(tools,body);filter.onchange=draw;mode.onchange=draw;draw();function draw(){body.replaceChildren();let year;for(const r of DATA.medication_timeline||[]){if(filter.value&&filter.value!==r.group||mode.value!=='all'&&mode.value!==r.kind)continue;const y=r.date?r.date.slice(0,4):'Date unknown';if(y!==year){body.append(el('h2',y));year=y}const a=el('article');a.dataset.medicationEntry=r.entry_id;a.dataset.medicationKind=r.kind;a.append(el('h3',(r.date||'Date unknown')+' · '+r.group),el('p',r.kind==='order'?'Prescription':r.event_type==='not_started'?'Not taken':r.event_type,'meta'));if(r.dose)a.append(el('p','Dose: '+r.dose));if(r.regimen)a.append(el('p',r.regimen));if(r.strength)a.append(el('p','Prescribed product strength: '+r.strength,'meta'));if(r.benefit)a.append(el('p','Reported benefit: '+r.benefit));if(r.adverse_effect)a.append(el('p','Reported adverse effect: '+r.adverse_effect));a.append(badge(r.source),source(r.source));if(r.source.uncertainties)a.append(el('p',r.source.uncertainties,'meta'));body.append(a)}if(!body.children.length)empty(body)}}
function renderLabs(){const m=section('labs');m.append(el('p','Rows are analytes; columns are dated collection/report events. Display families do not prove clinical comparability. Source values, references, units and methods remain inspectable. Blank means no result.','notice'));if(DATA.links.laboratory)m.append(link(L.labSheet,DATA.links.laboratory));const body=el('div');toolbar(m,[['blood',L.blood],['urine',L.urine],['stool',L.stool]],draw);m.append(body);function draw(q='',category='blood'){body.replaceChildren();const events=DATA.matrix.events.filter(e=>e.category===category),keys=new Set(events.flatMap(e=>Object.keys(e.cells))),cols=DATA.matrix.columns.filter(c=>keys.has(c.key)&&[c.name,c.unit,c.specimen,c.raw_name].join(' ').toLocaleLowerCase().includes(q));if(!events.length||!cols.length){undatedLabs(body,q,category);if(!body.children.length)empty(body);return}const visible=events.filter(e=>!q||cols.some(c=>e.cells[c.key])),headers=[L.sourceText,...visible.map(e=>{const x=el('div',e.date);x.append(el('p',e.laboratory,'meta'),el('p',e.specimen,'meta'));for(const id of e.document_ids)x.append(source({source_document_id:id}));return x})],rows=cols.map(c=>[c.name+(c.unit?' ['+c.unit+']':'')+(c.specimen?' {'+c.specimen+'}':''),...visible.map(e=>{const rs=e.cells[c.key];if(!rs)return null;const x=el('div');for(const r of rs){x.append(el('div',r._display?.display_value??r.raw_value,'value'));if(r.flag_raw)x.append(el('span',r.flag_raw,'flag'));if(r._display?.note)x.append(el('p',r._display.note,'meta'));x.append(rawDetails(r))}return x})]);body.append(table(headers,rows,'matrix'));undatedLabs(body,q,category)}draw()}
function renderConditions(){const m=section('conditions'),rs=DATA.tables.clinical_entries.filter(r=>r.entry_kind.includes('diagnosis')).slice().sort((a,b)=>(b.event_date||'').localeCompare(a.event_date||'')),groups=new Map();m.append(el('p',L.historical,'notice'));for(const r of rs){const key=[r.coding_system,r.code,r.statement_raw].join('|'),g=groups.get(key)||{label:r.statement_raw,code:r.code,first:null,last:null,count:0,source:r};g.count++;if(r.event_date){g.first=!g.first||r.event_date<g.first?r.event_date:g.first;g.last=!g.last||r.event_date>g.last?r.event_date:g.last}groups.set(key,g)}m.append(el('h3','Summary'),table(['Source wording','Code','First recorded','Last recorded','Records','Source'],[...groups.values()].map(g=>[g.label,g.code,g.first,g.last,g.count,source(g.source)])),el('h3','Details by date'));for(const r of rs)m.append(clinicalCard(r));if(!rs.length)empty(m)}
function renderAllergies(){const m=section('allergies');m.append(el('p','Allergy findings, sensitization and reported reactions retain their original source type. A positive test or an adverse effect is not automatically an allergy diagnosis.','notice'));const rs=DATA.tables.clinical_entries.filter(r=>/allerg|sensiti|reaction/.test(r.entry_kind)).slice().sort((a,b)=>(b.event_date||'').localeCompare(a.event_date||''));for(const r of rs)m.append(clinicalCard(r));const ctx=DATA.context.summary||{};for(const r of [...(ctx.sensitizations||[]),...(ctx.reported_contact_allergies||[])])m.append(el('p',JSON.stringify(r),'meta'));if(!rs.length)empty(m)}

const sections=['overview','vaccines','labs','vitals','history','reports','conditions','allergies','medications','timeline','documents','review'];function show(key){if(!sections.includes(key))key='overview';for(const b of $('nav').children)b.classList.toggle('active',b.dataset.key===key);if(key==='overview')renderOverview();else if(key==='vaccines')renderVaccines();else if(key==='labs')renderLabs();else if(key==='vitals')renderVitals();else if(key==='conditions')renderConditions();else if(key==='medications')renderMeds();else if(key==='timeline')renderMedicationTimeline();else if(key==='allergies')renderAllergies();else if(key==='documents')renderDocs();else if(key==='review')renderReview();else renderClinical(key);$('main').append(el('footer',L.disclaimer+' · '+L.snapshot));history.replaceState(null,'','#'+key)}
$('title').textContent=L.title;$('subtitle').textContent=L.subtitle+' · '+L.asof+' '+(DATA.as_of||DATA.generated_at.slice(0,10));document.documentElement.lang=DATA.locale||'en';document.title=L.title;for(const key of sections){const b=el('button',L[key]);b.dataset.key=key;b.addEventListener('click',()=>show(key));$('nav').append(b)}for(const [key,label]of [['vaccinations',L.vaccineSheet],['laboratory',L.labSheet]])if(DATA.links[key]){$('external').append(link(label,DATA.links[key]),el('br'))}show(location.hash.slice(1));
</script></body></html>
