<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Health archive</title>
<style>
:root{font-family:Inter,Segoe UI,system-ui,sans-serif;color:#172638;background:#f3f6fa;--accent:#125f6a;--line:#dbe3ec;--muted:#56687b}*{box-sizing:border-box}body{margin:0}header{background:white;border-bottom:1px solid var(--line);padding:24px 32px;display:flex;justify-content:space-between;gap:20px;align-items:center}h1{font-size:26px;letter-spacing:-.6px;margin:0 0 5px}h2{font-size:22px;margin:0 0 14px}h3{font-size:16px;margin:0 0 10px}p{line-height:1.55;margin:8px 0}.muted,.meta{color:var(--muted);font-size:13px}a{color:var(--accent)}.layout{display:grid;grid-template-columns:220px minmax(0,1fr);min-height:calc(100vh - 100px)}nav{padding:24px 16px;background:#fafbfd;border-right:1px solid var(--line)}nav button{display:block;width:100%;padding:12px 14px;margin:4px 0;border:0;border-radius:8px;background:transparent;text-align:left;font:inherit;color:var(--muted);cursor:pointer}nav button.active{background:#dceff0;color:#064b55;font-weight:650}main{padding:28px 32px;max-width:1600px;width:100%}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px;margin-bottom:24px}.card,article,.panel{background:white;border:1px solid var(--line);border-radius:12px;padding:20px;margin-bottom:16px}.card strong{display:block;font-size:27px;margin:8px 0}.toolbar{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin:12px 0 18px}input,select,button.control{font:inherit;font-size:14px;padding:10px 12px;border:1px solid #c8d4df;border-radius:7px;background:white}input{min-width:220px;flex:1}.scroll{overflow:auto;max-height:70vh;border:1px solid var(--line);border-radius:8px;background:white}table{border-collapse:separate;border-spacing:0;width:100%;font-size:13px}th,td{padding:12px 14px;text-align:left;vertical-align:top;border-bottom:1px solid #e5ebf1;border-right:1px solid #eef2f6;line-height:1.45}th{background:#edf2f6;font-weight:650;position:sticky;top:0;z-index:2;white-space:normal;min-width:140px}th:first-child,td:first-child{position:sticky;left:0;z-index:1;min-width:125px;background:#fafbfd}th:first-child{z-index:3;background:#edf2f6}tr:last-child td{border-bottom:0}.matrix th{min-width:150px}.matrix td{min-width:130px}.matrix td.event{min-width:220px}.pill{display:inline-block;font-size:11px;line-height:1.5;padding:3px 8px;border-radius:20px;background:#eef2f6;color:#536174;margin:4px 4px 0 0}.warn{background:#fff2d4;color:#7a570c}.reported{background:#e4edf9;color:#33567d}.value{font-weight:650;font-size:14px}.flag{color:#7a570c;font-size:12px}.empty{padding:30px;color:var(--muted);background:#fff;border:1px dashed #c5d1dc;border-radius:10px}.source{font-size:12px;margin-top:9px}.timeline article{border-left:4px solid #b7d2d6}.summary-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(330px,1fr));gap:16px}details{margin-top:12px}summary{cursor:pointer;color:var(--accent)}pre{white-space:pre-wrap;overflow-wrap:anywhere;font:12px/1.5 ui-monospace,monospace;background:#f5f7fa;padding:14px;border-radius:8px}svg{max-width:100%;height:auto}.notice{border-left:3px solid #cfad57;padding:10px 16px;background:#fff9e9;font-size:13px;border-radius:6px;margin:16px 0}footer{color:var(--muted);font-size:12px;margin-top:24px}body.print nav,body.print .toolbar{display:none}@media(max-width:850px){header{padding:18px;display:block}.layout{display:block}nav{display:flex;overflow:auto;padding:10px;position:sticky;top:0;z-index:5;border-bottom:1px solid var(--line)}nav button{white-space:nowrap;width:auto}main{padding:20px 16px}.summary-grid{display:block}}@media print{nav,.toolbar,header a{display:none}.layout{display:block}main{padding:0}.scroll{max-height:none;overflow:visible}header{padding:0 0 15px}article,.panel{break-inside:avoid}}
</style></head><body><header><div><h1 id="title"></h1><div class="muted" id="subtitle"></div></div><div id="external"></div></header><div class="layout"><nav id="nav"></nav><main id="main"></main></div>
<script>
const DATA=__PRIVATE_MODEL__;
const EN={title:'Health archive',subtitle:'Sources, history and read-only views',overview:'Overview',vaccines:'Vaccinations',labs:'Laboratory history',vitals:'Measurements',history:'Clinical timeline',reports:'Reports and visits',conditions:'Conditions and allergies',medications:'Medicines',documents:'Documents',review:'Needs clarification',search:'Search',all:'All',blood:'Blood',urine:'Urine',stool:'Stool',date:'Date',source:'Source',unknown:'Unknown',uncertain:'Needs clarification',verified:'Transcription verified',reported:'Owner report',historical:'Historical record; current status not reassessed',empty:'No records are available for this view.',records:'Records',asof:'As of',snapshot:'Read-only view from the accepted database. Updates require a new verified generation.',disclaimer:'Informational archive; not a diagnosis, prescription or clinical decision system.',vaccineSheet:'Open vaccination Sheet',labSheet:'Open laboratory Sheet',original:'Original',details:'Details',infection:'Infection',product:'Vaccine',kind:'Type',rawDate:'Date as entered',dose:'Dose',result:'Result',comment:'Comment',batch:'Batch',manufacturer:'Manufacturer',labNote:'Rows are investigation events; columns are recorded analytes. Different units/specimens are separated. A displayed comparison does not establish assay comparability. Blank means no result, not zero. Click a value for its reference interval and source.',vaxNote:'The original history layout is retained. Tuberculin tests and reported diseases are not counted as vaccinations. Conflicting and placeholder dates remain visible with clarification labels.',rxNote:'Prescriptions and actual use are separate. A prescription, receipt or planned end date does not establish taking a medicine.',order:'Prescription',use:'Reported or documented use',legacy:'Previous archive context',sourceNote:'Source and uncertainty',noDate:'Date unknown',lab:'Laboratory',specimen:'Specimen',reference:'Reference',unit:'Unit',note:'Note',metricsNote:'Measurements are historical. No clinical interpretation or treatment threshold is added.',printedFlag:'Printed source flag',reviewNote:'These rows remain unresolved. Their raw tokens are preserved; ambiguous numeric values are not chart points.',accepted:'Committed records',sources:'Sources',measurements:'Results and measurements',unresolved:'Unresolved rows',legacyNote:'Preserved from the earlier summary with its original provenance. These entries have not been re-established as current clinical facts.',dataStatus:'Data status',openSheet:'Open Google Sheet',sourceText:'Source text',bp:'Ambulatory blood pressure',bpNote:'Raw recorded measurements from one report; missing pages and conclusions remain listed separately.',systolic:'SBP',diastolic:'DBP',pulse:'Pulse',map:'MAP',event:'Event',knownDate:'Event date',noCurrent:'Current use or clinical status is not established by this archive entry.',print:'Print this view',vaxRecord:'Vaccine record',mantoux:'Tuberculin test',diseaseHistory:'Reported disease history'};
const L={...EN,...DATA.labels};const $=id=>document.getElementById(id);const status=v=>(DATA.status_labels||{})[v]||v||'';
function el(tag,text,cls){const x=document.createElement(tag);if(text!==undefined)x.textContent=text;if(cls)x.className=cls;return x}
function link(label,url){const a=el('a',label);if(url&&(/^(https:\/\/|\.\.\/|details\/)/.test(url)))a.href=url;return a}
function source(r){const div=el('div',undefined,'source');const d=DATA.documents.find(d=>d.entry_id===r.source_document_id);div.append(link(r.source_document_id||L.source,d?'details/'+d.entry_id+'.md':null),el('span',' · '+(r.source_locator||'')));return div}
function badge(r){return el('span',r.review_status==='needs_review'||r.review_status==='unreadable'?L.uncertain:r.source_kind==='owner_report'?L.reported:L.verified,'pill '+(r.review_status==='needs_review'||r.review_status==='unreadable'?'warn':r.source_kind==='owner_report'?'reported':''))}
function rawDetails(r){const d=el('details');d.append(el('summary',L.details));const p=el('div');p.append(el('p',(r.source_text||r.statement_raw||'')));for(const [k,label]of [['unit_raw',L.unit],['reference_range_raw',L.reference],['laboratory_raw',L.lab],['specimen_raw',L.specimen],['flag_raw',L.printedFlag],['uncertainties',L.note]])if(r[k])p.append(el('p',label+': '+r[k],'meta'));p.append(source(r),badge(r));d.append(p);return d}
function table(headers,rows,cls){const wrap=el('div',undefined,'scroll'),t=el('table',undefined,cls);const th=el('thead'),tr=el('tr');headers.forEach(h=>tr.append(el('th',h)));th.append(tr);t.append(th);const b=el('tbody');for(const row of rows){const r=el('tr');for(const cell of row){const td=el('td');if(cell instanceof Node)td.append(cell);else td.textContent=cell??'—';r.append(td)}b.append(r)}t.append(b);wrap.append(t);return wrap}
function empty(parent){parent.append(el('div',L.empty,'empty'))}
function section(key){const m=$('main');m.replaceChildren(el('h2',L[key]));m.append(el('p',L.asof+': '+(DATA.as_of||DATA.generated_at.slice(0,10)),'meta'));return m}
function toolbar(parent,choices,onChange){const div=el('div',undefined,'toolbar'),q=el('input');q.placeholder=L.search;q.setAttribute('aria-label',L.search);const select=el('select');for(const [v,t]of choices){const opt=el('option',t);opt.value=v;select.append(opt)}div.append(q);if(choices.length)div.append(select);parent.append(div);q.addEventListener('input',()=>onChange(q.value.toLocaleLowerCase(),select.value));select.addEventListener('change',()=>onChange(q.value.toLocaleLowerCase(),select.value));return{q,select}}
function episodeContent(v){const p=el('div');if(v.reported_at)p.append(el('p',(L.reportedDate||'Reported')+': '+v.reported_at,'meta'));if(v.temperature_c!==undefined&&v.temperature_c!==null)p.append(el('p',(L.temperature||'Temperature')+': '+v.temperature_c+' °C','value'));p.append(el('p',L.noCurrent,'meta'));if(v.temperature_measurements?.length)p.append(table([L.date,L.temperature||'Temperature',L.source],v.temperature_measurements.map(r=>[r.measured_at||r.reported_date||L.noDate,r.value_c+' °C',r.source||L.unknown])));return p}function spirometryContent(v){const p=el('div');p.append(el('p',v.date||L.noDate,'meta'),table([L.sourceText,L.result,L.unit],[['FVC',v.fvc_l,'L'],['FEV1',v.fev1_l,'L'],['FEV1/FVC',v.fev1_fvc_pct,'%']]));if(v.physician_interpretation)p.append(el('p',(L.physicianConclusion||'Physician conclusion')+': '+v.physician_interpretation));if(v.quality_limitation)p.append(el('p',v.quality_limitation,'notice'));p.append(el('p',L.source+': '+(v.source||L.unknown),'meta'));return p}function undatedLabs(body,q,category){const rs=(DATA.undated_laboratory||[]).filter(r=>r.display_category===category&&JSON.stringify(r).toLocaleLowerCase().includes(q));if(!rs.length)return;body.append(el('h3',L.noDate));for(const r of rs){const a=el('article');a.append(el('p',r.analyte_name_raw+': '+r.raw_value+' '+(r.unit_raw||'')),badge(r),rawDetails(r));body.append(a)}}
function renderOverview(){const m=section('overview'),cards=el('div',undefined,'cards');const uncertain=Object.values(DATA.tables).flat().filter(r=>['needs_review','unreadable'].includes(r.review_status));for(const [label,value]of [[L.sources,DATA.documents.length],[L.measurements,DATA.tables.observations.length],[L.records,DATA.tables.clinical_entries.length],[L.unresolved,uncertain.length]]){const c=el('div',undefined,'card');c.append(el('div',label,'meta'),el('strong',String(value)));cards.append(c)}m.append(cards);const ctx=DATA.context.summary||{},grid=el('div',undefined,'summary-grid');for(const [label,value]of [[L.conditions,ctx.documented_conditions],[L.medications,ctx.medications],[L.legacy,ctx.active_episode]]){if(!value)continue;const p=el('div',undefined,'panel');p.append(el('h3',label));if(Array.isArray(value))for(const r of (label===L.medications?value.filter(r=>r.status?.startsWith('reported')):value)){p.append(el('p',r.label||r.product||r.code||''));p.append(el('p',[r.date||r.reported_at,status(r.status||r.current_status),r.reported_dose,r.source].filter(Boolean).join(' · '),'meta'))}else{p.append(episodeContent(value))}p.append(el('p',L.legacyNote,'meta'));grid.append(p)}m.append(grid);const latest=DATA.tables.clinical_entries.filter(r=>!r.entry_kind.includes('vaccin')&&!r.entry_kind.includes('tuberculin')&&!r.entry_kind.includes('disease_history')).slice().sort((a,b)=>(b.event_date||'').localeCompare(a.event_date||'')).slice(0,4);for(const r of latest)m.append(clinicalCard(r));m.append(el('div',L.snapshot,'notice'))}
function clinicalCard(r){const a=el('article');a.append(el('div',(r.event_date||L.noDate)+' · '+r.entry_kind,'meta'),el('p',r.statement_raw),badge(r),source(r));if(r.clinician_raw||r.organization_raw)a.append(el('p',[r.clinician_raw,r.organization_raw].filter(Boolean).join(' · '),'meta'));if(r.followup_raw)a.append(el('p',r.followup_raw));if(r.completion_status_raw)a.append(el('p',r.completion_status_raw,'meta'));if(r.uncertainties)a.append(el('p',r.uncertainties,'meta'));return a}
function renderVaccines(){const m=section('vaccines');m.append(el('p',L.vaxNote,'notice'));if(DATA.links.vaccinations)m.append(link(L.vaccineSheet,DATA.links.vaccinations));const body=el('div');toolbar(m,[['',L.all],['vaccination_record',L.vaxRecord],['tuberculin_test_record',L.mantoux],['reported_disease_history',L.diseaseHistory]],draw);m.append(body);function draw(q='',kind=''){body.replaceChildren();const records=DATA.vaccines.filter(r=>(!kind||r.entry_kind===kind)&&JSON.stringify(r).toLocaleLowerCase().includes(q));if(!records.length)return empty(body);const rows=records.map(r=>{const c=r.cells.slice();while(c.length<9)c.push(null);const date=el('div',c[3]||'—');date.append(el('div',L.knownDate+': '+(r.event_date||L.unknown),'meta'),badge(r));c[3]=date;const note=el('div',c[6]||'');if(r.uncertainties)note.append(el('p',r.uncertainties,'meta'));note.append(source(r));c[6]=note;return c});body.append(table([L.infection,L.product,L.kind,L.rawDate,L.dose,L.result,L.comment,L.batch,L.manufacturer],rows))}draw()}
function renderLabs(){const m=section('labs');m.append(el('p',L.labNote,'notice'));if(DATA.links.laboratory)m.append(link(L.labSheet,DATA.links.laboratory));const body=el('div');toolbar(m,[['blood',L.blood],['urine',L.urine],['stool',L.stool]],draw);m.append(body);function draw(q='',category='blood'){body.replaceChildren();const events=DATA.matrix.events.filter(e=>e.category===category);const keys=new Set(events.flatMap(e=>Object.keys(e.cells)));const cols=DATA.matrix.columns.filter(c=>keys.has(c.key)&&[c.name,c.unit,c.specimen].join(' ').toLocaleLowerCase().includes(q));if(!events.length||!cols.length){undatedLabs(body,q,category);if(!body.children.length)empty(body);return}const headers=[L.event,...cols.map(c=>c.name+(c.raw_name&&c.raw_name!==c.name?' · '+c.raw_name:'')+(c.unit?'\n'+c.unit:'')+(c.specimen?'\n'+c.specimen:''))];const visibleEvents=q?events.filter(e=>cols.some(c=>e.cells[c.key])):events;const rows=visibleEvents.map(e=>{const a=el('div',e.date);a.append(el('p',e.laboratory,'meta'),el('p',e.specimen,'meta'),link(e.document_id||L.reported,e.document_id?'details/'+e.document_id+'.md':null));return[a,...cols.map(c=>{const rs=e.cells[c.key];if(!rs)return null;const div=el('div');for(const r of rs){div.append(el('div',r.raw_value,'value'));if(r.flag_raw)div.append(el('span',r.flag_raw,'flag'));div.append(rawDetails(r))}return div})]});body.append(table(headers,rows,'matrix'));undatedLabs(body,q,category)}draw()}
function renderClinical(key){const m=section(key),body=el('div',undefined,'timeline');toolbar(m,[],draw);m.append(body);function draw(q=''){body.replaceChildren();const rs=DATA.tables.clinical_entries.filter(r=>!['vaccination_record','tuberculin_test_record','reported_disease_history'].includes(r.entry_kind)&&JSON.stringify(r).toLocaleLowerCase().includes(q)&&(key!=='reports'||['imaging_report','imaging_findings','imaging_summary_translation','encounter','procedure','investigation_order'].includes(r.entry_kind)));rs.sort((a,b)=>(b.event_date||'').localeCompare(a.event_date||''));if(!rs.length)return empty(body);rs.forEach(r=>body.append(clinicalCard(r)))}draw()}
function renderConditions(){const m=section('conditions');m.append(el('p',L.historical,'notice'));for(const r of DATA.tables.clinical_entries.filter(r=>r.entry_kind==='diagnosis'||r.entry_kind.includes('allerg')))m.append(clinicalCard(r));const ctx=DATA.context.summary||{};for(const [name,values]of [[L.conditions,ctx.documented_conditions],[L.legacy,ctx.sensitizations],[L.reported,ctx.reported_contact_allergies]]){if(!values?.length)continue;const p=el('div',undefined,'panel');p.append(el('h3',name),table([L.sourceText,L.date,L.sourceNote],values.map(r=>[r.label||r.allergen||'',r.date||L.unknown,[r.result,r.source,r.current_status,r.document_status].filter(Boolean).join(' · ')])),el('p',L.legacyNote,'meta'));m.append(p)}if(ctx.drug_allergies)m.append(el('p',L.dataStatus+': '+JSON.stringify(ctx.drug_allergies),'meta'))}
function renderMeds(){const m=section('medications');m.append(el('p',L.rxNote,'notice'));const legacy=(DATA.context.summary||{}).medications||[];if(legacy.length){const p=el('div',undefined,'panel');p.append(el('h3',L.legacy),table([L.product,L.use,L.date,L.sourceNote],legacy.map(r=>[r.product,[status(r.status),r.reported_dose,r.prescribed_dose].filter(Boolean).join(' · '),r.reported_at||L.unknown,[r.source,r.notes].filter(Boolean).join(' · ')])));m.append(p)}for(const r of DATA.tables.medication_orders){const a=el('article');a.append(el('h3',L.order+' · '+(r.event_date||L.noDate)),el('p',r.source_text),el('p',L.noCurrent,'meta'),badge(r),source(r));if(r.uncertainties)a.append(el('p',r.uncertainties,'meta'));m.append(a)}for(const r of DATA.tables.medication_use_events){const a=el('article');a.append(el('h3',L.use+' · '+(r.event_date||L.noDate)),el('p',r.source_text),badge(r),source(r));if(r.uncertainties)a.append(el('p',r.uncertainties,'meta'));if(r.benefit_reported_raw)a.append(el('p',r.benefit_reported_raw));if(r.adverse_effect_reported_raw)a.append(el('p',r.adverse_effect_reported_raw));m.append(a)}}
function renderDocs(){const m=section('documents'),body=el('div');toolbar(m,[],draw);m.append(body);function draw(q=''){body.replaceChildren();const docs=DATA.documents.filter(d=>JSON.stringify(d).toLocaleLowerCase().includes(q));for(const d of docs){const a=el('article');a.append(el('h3',d.title),el('p',(d.document_date||L.noDate)+' · '+d.document_kind,'meta'),link(L.original,d.original_url||(d.original_path?'../'+d.original_path:null)),el('span',' · '),link(L.details,'details/'+d.entry_id+'.md'));if(d.missing_pages)a.append(el('p',d.missing_pages,'notice'));body.append(a)}if(!docs.length)empty(body)}draw()}
function renderReview(){const m=section('review');m.append(el('p',L.reviewNote,'notice'));const rs=Object.values(DATA.tables).flat().filter(r=>['needs_review','unreadable'].includes(r.review_status));for(const c of DATA.pending_corrections||[]){const a=el('article');a.append(el('h3',L.uncertain),el('p',c.reason_raw||c.source_text),el('p',c.target_entry_id+' -> '+(c.replacement_entry_id||''),'meta'),source(c));m.append(a)}for(const r of rs){const a=el('article');a.append(el('p',r.source_text),badge(r),el('p',r.uncertainties||''),source(r));m.append(a)}for(const d of DATA.documents.filter(d=>d.missing_pages))m.append(el('p',d.entry_id+': '+d.missing_pages,'notice'));if(!rs.length)empty(m)}
function renderVitals(){const m=section('vitals');m.append(el('p',L.metricsNote,'notice'));const rs=DATA.tables.observations.filter(r=>(r.method_raw||'').includes('ABPM')||['mmHg','bpm'].includes(r.unit_raw));if(rs.length){const grouped={};for(const r of rs){const time=(r.source_locator.match(/\([12]\)(\d\d:\d\d)/)||[])[1]||'';const key=[r.source_document_id,r.event_date||'',time].join('|');const g=grouped[key]||(grouped[key]={date:r.event_date,time,doc:r.source_document_id,values:{},uncertain:false});(g.values[r.analyte_name_raw]||(g.values[r.analyte_name_raw]=[])).push(r);if(['needs_review','unreadable'].includes(r.review_status))g.uncertain=true}const rows=Object.values(grouped).sort((a,b)=>[a.date||'9999',a.time].join().localeCompare([b.date||'9999',b.time].join()));m.append(el('h3',L.bp),el('p',L.bpNote,'meta'),table([L.date,L.systolic,L.diastolic,L.map,L.pulse,L.source],rows.map(g=>{function cell(names){const x=el('div');const records=names.flatMap(n=>g.values[n]||[]);if(!records.length)return null;for(const r of records){x.append(el('div',r.raw_value,'value'),badge(r),rawDetails(r))}return x}return[(g.date||L.noDate)+' '+g.time,cell(['SBP','SYS']),cell(['DBP','DIA']),cell(['MAP']),cell(['Pulse','PR']),link(g.doc,'details/'+g.doc+'.md')]})))}else empty(m);const ctx=DATA.context.summary||{};if(ctx.active_episode){const p=el('div',undefined,'panel');p.append(el('h3',L.legacy),episodeContent(ctx.active_episode),el('p',L.legacyNote,'meta'));m.append(p)}if(ctx.spirometry){const p=el('div',undefined,'panel');p.append(el('h3',L.spirometry||'Spirometry'),spirometryContent(ctx.spirometry),el('p',L.legacyNote,'meta'));m.append(p)}}
const sections=['overview','vaccines','labs','vitals','history','reports','conditions','medications','documents','review'];function show(key){if(!sections.includes(key))key='overview';for(const b of $('nav').children)b.classList.toggle('active',b.dataset.key===key);if(key==='overview')renderOverview();else if(key==='vaccines')renderVaccines();else if(key==='labs')renderLabs();else if(key==='vitals')renderVitals();else if(key==='conditions')renderConditions();else if(key==='medications')renderMeds();else if(key==='documents')renderDocs();else if(key==='review')renderReview();else renderClinical(key);$('main').append(el('footer',L.disclaimer+' · '+L.snapshot));history.replaceState(null,'','#'+key)}
$('title').textContent=L.title;$('subtitle').textContent=L.subtitle+' · '+L.asof+' '+(DATA.as_of||DATA.generated_at.slice(0,10));document.documentElement.lang=DATA.locale||'en';document.title=L.title;for(const key of sections){const b=el('button',L[key]);b.dataset.key=key;b.addEventListener('click',()=>show(key));$('nav').append(b)}for(const [key,label]of [['vaccinations',L.vaccineSheet],['laboratory',L.labSheet]])if(DATA.links[key]){$('external').append(link(label,DATA.links[key]),el('br'))}show(location.hash.slice(1));
</script></body></html>
