name: Publish plugin release

on:
  push:
    branches: [main]
    paths:
      - plugin.json
      - .github/workflows/release.yml
      - scripts/release.py
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: plugin-release-main
  cancel-in-progress: false

jobs:
  release:
    if: >-
      github.repository == 'Osintsevse/health-evidence-companion' &&
      github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Verify reviewed main ancestry
        run: |
          test "$(git rev-parse HEAD)" = "$(git ls-remote origin refs/heads/main | cut -f1)"
      - name: Validate and test
        run: |
          python3 scripts/validate.py
          python3 -m unittest discover -s tests -v
          python3 -m unittest discover -s examples/drugbank -v
      - name: Build archives and checksums
        run: python3 scripts/build.py
      - name: Publish GitHub assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: python3 scripts/release.py --execute
      - name: Retain the latest stable release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          expected="v$(python3 -c 'import json; print(json.load(open("plugin.json"))["version"])')"
          latest=$(gh api "repos/$GH_REPO/releases/latest" --jq '.tag_name')
          test "$latest" = "$expected"
          old=$(gh api --paginate "repos/$GH_REPO/releases?per_page=100" --jq ".[] | select(.draft == false and .prerelease == false and .tag_name != \"$latest\") | .id")
          if [ -n "$old" ]; then
            while IFS= read -r id; do
              gh api --method DELETE "repos/$GH_REPO/releases/$id"
            done <<< "$old"
          fi
