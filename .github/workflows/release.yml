name: Publish plugin release

on:
  push:
    branches: [main]
    tags: ['v*']
    paths:
      - plugin.json
      - .github/workflows/release.yml
      - scripts/release.py
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: plugin-release-${{ github.sha }}
  cancel-in-progress: false

jobs:
  release:
    if: >-
      github.repository == 'Osintsevse/health-evidence-companion' &&
      (github.ref == 'refs/heads/main' ||
       (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Verify reviewed main ancestry
        run: |
          git merge-base --is-ancestor HEAD origin/main
      - name: Validate and test
        run: |
          python3 scripts/validate.py
          python3 -m unittest discover -s tests -v
          python3 -m unittest discover -s examples/drugbank -v
      - name: Build archives and checksums
        run: python3 scripts/build.py
      - name: Publish GitHub assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: python3 scripts/release.py --execute
