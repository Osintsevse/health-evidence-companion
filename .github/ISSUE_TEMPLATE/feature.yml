name: Feature request
description: Suggest a package capability with a task and observable acceptance criteria.
title: "[Feature] "
body:
  - type: markdown
    attributes:
      value: "Public proposal only. Do not include real conversations, health records, medicine histories, genetic data, private links, screenshots or secrets. Use wholly fictional examples marked synthetic."
  - type: textarea
    id: task
    attributes:
      label: Task and missing capability
      description: What should the package help people accomplish, and what is missing?
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Desired result and acceptance criteria
      description: Describe observable behavior that would make this feature useful.
    validations:
      required: true
  - type: textarea
    id: example
    attributes:
      label: Synthetic example and alternatives
      description: Optional wholly fictional input/output example and current workarounds.
  - type: input
    id: environment
    attributes:
      label: Package version and host, if known
  - type: checkboxes
    id: privacy
    attributes:
      label: Public contribution boundary
      options:
        - label: This proposal contains no real personal health information, private conversation, private link or secret.
          required: true
