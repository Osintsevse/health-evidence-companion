name: General knowledge or package issue
description: Report a general evidence gap or reproducible package issue without personal data.
body:
  - type: markdown
    attributes:
      value: "Do not include real cases, medical records, medicine histories, private links or credentials."
  - type: textarea
    id: issue
    attributes:
      label: General question or package problem
      description: General behavior only; do not paste real chats, records, genetic data or sensitive logs.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected versus observed behavior
      description: For a package problem, describe the difference without quoting a real conversation.
  - type: textarea
    id: reproduction
    attributes:
      label: Synthetic reproduction steps
      description: Use wholly fictional input marked synthetic. State whether these steps were actually tested.
  - type: input
    id: environment
    attributes:
      label: Package version and host, if known
  - type: textarea
    id: sources
    attributes:
      label: Public primary sources and versions
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy
      options:
        - label: This report contains no real person's health information or secrets.
          required: true
