name: Knowledge gap
description: Request a general topic or clearer explanation without needing sources first.
title: "[Knowledge] "
body:
  - type: markdown
    attributes:
      value: "This requests a review of general knowledge or instructions, not model-weight training. Public proposal only. Do not include real conversations, health records, medicine histories, genetic data, private links, screenshots or secrets. Use wholly fictional examples marked synthetic."
  - type: textarea
    id: question
    attributes:
      label: General question or missing explanation
      description: Describe the topic independently of the personal question that motivated it.
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Intended scope and useful result
      description: Relevant population, setting, country or explanation level; no individual case.
    validations:
      required: true
  - type: textarea
    id: sources
    attributes:
      label: Optional public sources
      description: Leave empty if you have not researched the topic. Do not invent citations.
  - type: checkboxes
    id: privacy
    attributes:
      label: Public contribution boundary
      options:
        - label: This proposal contains no real personal health information, private conversation, private link or secret.
          required: true
